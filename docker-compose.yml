# docker-compose.yml
name: pagamentos-webhooks

services:
  postgres:
    image: postgres:17-alpine
    container_name: pagamentos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pagamentos_webhooks}
      POSTGRES_USER: ${POSTGRES_USER:-pagamentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pagamentos_local_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pagamentos} -d ${POSTGRES_DB:-pagamentos_webhooks}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer:5
    container_name: pagamentos-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [ferramentas]

volumes:
  postgres-dados: